<!-- Widget Obrolan AI — pojok kanan bawah -->
<div class="obrolan" id="obrolan">
  <button
    class="obrolan__tombol"
    type="button"
    id="obrolan-tombol"
    aria-label="Buka chat asisten AI"
    aria-expanded="false"
    aria-controls="obrolan-panel"
  >
    <span class="obrolan__tombol-ikon obrolan__tombol-ikon--chat" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a8.5 8.5 0 0 1-8.5 8.5c-1.4 0-2.7-.3-3.9-.9L3 21l1.5-4.4A8.5 8.5 0 1 1 21 12z"/>
      </svg>
    </span>
    <span class="obrolan__tombol-ikon obrolan__tombol-ikon--tutup" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </span>
    <span class="obrolan__badge" id="obrolan-badge" hidden>1</span>
  </button>

  <section
    class="obrolan__panel"
    id="obrolan-panel"
    role="dialog"
    aria-modal="false"
    aria-labelledby="obrolan-judul"
    hidden
  >
    <header class="obrolan__kepala">
      <div class="obrolan__identitas">
        <img
          src="assets/images/logotransparant.png"
          alt=""
          width="36"
          height="36"
          decoding="async"
        />
        <div>
          <h2 class="obrolan__judul" id="obrolan-judul">Asisten DI</h2>
          <p class="obrolan__status"><span class="obrolan__titik"></span> AI Online</p>
        </div>
      </div>
      <button class="obrolan__tutup" type="button" id="obrolan-tutup" aria-label="Tutup chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </header>

    <div class="obrolan__pesan" id="obrolan-pesan" role="log" aria-live="polite" aria-relevant="additions"></div>

    <form class="obrolan__form" id="obrolan-form" autocomplete="off">
      <label class="sr-only" for="obrolan-input">Tulis pesan</label>
      <textarea
        id="obrolan-input"
        class="obrolan__input"
        rows="1"
        placeholder="Tanyakan layanan, harga, atau demo..."
        maxlength="1000"
        required
      ></textarea>
      <button class="obrolan__kirim" type="submit" aria-label="Kirim pesan" id="obrolan-kirim">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <path d="M22 2L11 13"/>
          <path d="M22 2L15 22l-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </form>
  </section>
</div>
